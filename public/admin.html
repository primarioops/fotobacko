<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Upload</title>
</head>

<body style="font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 12px;">

<h1>Admin upload (folder)</h1>

<p>
<label><b>Izaberi folder sa slikama:</b></label><br/>
<input id="file"
       type="file"
       accept="image/*"
       webkitdirectory
       directory
       multiple />
</p>

<p>
<button id="btn"
        style="padding: 10px 14px; font-size: 16px;">
Upload
</button>
</p>

<pre id="out"
     style="background:#f5f5f5; padding: 12px; white-space: pre-wrap;"></pre>

<script>
const out = document.getElementById("out");

document.getElementById("btn").addEventListener("click", async () => {

  const fileInput = document.getElementById("file");
  const files = fileInput.files;

  if (!files.length) {
    out.textContent = "Izaberi folder sa slikama.";
    return;
  }

  const pass = prompt("Unesi ADMIN_PASSWORD:");
  if (!pass) {
    out.textContent = "Otkazano.";
    return;
  }

  // Automatski uzimamo ime foldera iz prvog fajla
  const firstPath = files[0].webkitRelativePath;
  const album = firstPath.split("/")[0];

  out.textContent = "Pronađen album: " + album + "\n\nUpload u toku...\n";

  for (let i = 0; i < files.length; i++) {

    out.textContent =
      "Album: " + album + "\n" +
      "Upload " + (i + 1) + " / " + files.length;

    const fd = new FormData();
    fd.append("album", album);

    const file = files[i];
    const cleanFile = new File([file], file.name, { type: file.type });

    fd.append("file", cleanFile);

    const resp = await fetch("/api/admin/upload", {
      method: "POST",
      headers: { "x-admin-password": pass },
      body: fd
    });

    if (!resp.ok) {
      const err = await resp.text();
      out.textContent =
        "Greška kod fajla: " + file.name + "\n\n" + err;
      return;
    }
  }

  out.textContent =
    "✅ Ceo folder je uploadovan.\n\n" +
    "Album: " + album + "\n\n" +
    "Osveži stranicu sajta.";
});
</script>

</body>
</html>
