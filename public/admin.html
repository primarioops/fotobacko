<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Upload</title>
</head>
<body style="font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 12px;">
  <h1>Admin upload</h1>

  <p style="margin-top: 20px;">
    <label><b>Album (folder u R2):</b></label><br/>
    <input id="album"
           style="width: 100%; padding: 10px; font-size: 16px;"
           placeholder='npr: 24-02-2026-FOTO-BACKO-vs-NEKO-pioniri' />
  </p>

  <p>
    <label><b>Izaberi folder sa slikama:</b></label><br/>
    <input id="file"
           type="file"
           accept="image/*"
           webkitdirectory
           directory
           multiple />
  </p>

  <p>
    <button id="btn"
            style="padding: 10px 14px; font-size: 16px;">
      Upload
    </button>
  </p>

  <pre id="out"
       style="background:#f5f5f5; padding: 12px; white-space: pre-wrap;"></pre>

  <script>
    const out = document.getElementById("out");

    document.getElementById("btn").addEventListener("click", async () => {

      const album = document.getElementById("album").value.trim();
      const fileInput = document.getElementById("file");
      const files = fileInput.files;

      if (!album) {
        out.textContent = "Unesi album.";
        return;
      }

      if (!files.length) {
        out.textContent = "Izaberi folder sa slikama.";
        return;
      }

      const pass = prompt("Unesi ADMIN_PASSWORD:");
      if (!pass) {
        out.textContent = "Otkazano.";
        return;
      }

      out.textContent = "Upload u toku...";

      for (let i = 0; i < files.length; i++) {

        const fd = new FormData();
        fd.append("album", album);

        // Uzimamo samo ime fajla bez putanje
        const file = files[i];
        const cleanFile = new File([file], file.name, { type: file.type });

        fd.append("file", cleanFile);

        const resp = await fetch("/api/admin/upload", {
          method: "POST",
          headers: { "x-admin-password": pass },
          body: fd
        });

        if (!resp.ok) {
          const err = await resp.text();
          out.textContent =
            "Greška kod fajla: " + file.name + "\n\n" + err;
          return;
        }
      }

      out.textContent =
        "✅ Ceo folder je uploadovan.\n\nOsveži stranicu albuma.";
    });
  </script>
</body>
</html>
