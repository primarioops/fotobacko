<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Upload</title>
</head>
<body style="font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 12px;">
  <h1>Admin upload</h1>

  <p style="margin-top: 20px;">
    <label><b>Album (folder u R2):</b></label><br/>
    <input id="album" style="width: 100%; padding: 10px; font-size: 16px;"
           placeholder='npr: 24-02-2026-FOTO-BAČKO-vs-NEKO-pioniri' />
  </p>

  <p>
    <label><b>Izaberi fajl:</b></label><br/>
    <input id="file" type="file" accept="image/*" />
  </p>

  <p>
    <button id="btn" style="padding: 10px 14px; font-size: 16px;">Upload</button>
  </p>

  <pre id="out" style="background:#f5f5f5; padding: 12px; white-space: pre-wrap;"></pre>

  <script>
    const out = document.getElementById("out");

    document.getElementById("btn").addEventListener("click", async () => {
      const album = document.getElementById("album").value.trim();
      const fileInput = document.getElementById("file");
      const file = fileInput.files[0];

      if (!album) { out.textContent = "Unesi album (ime foldera u R2)."; return; }
      if (!file) { out.textContent = "Izaberi sliku."; return; }

      const pass = prompt("Unesi ADMIN_PASSWORD:");
      if (!pass) { out.textContent = "Otkazano."; return; }

      const fd = new FormData();
      fd.append("album", album);
      fd.append("file", file);

      out.textContent = "Upload u toku...";

      const resp = await fetch("/api/admin/upload", {
        method: "POST",
        headers: { "x-admin-password": pass },
        body: fd
      });

      const data = await resp.json().catch(() => ({}));
      if (resp.ok) {
        out.textContent = "✅ OK\n\n" + JSON.stringify(data, null, 2) +
          "\n\nSada osveži početnu stranu sajta (ili album) da vidiš novu sliku.";
      } else {
        out.textContent = "❌ GREŠKA\n\n" + JSON.stringify(data, null, 2);
      }
    });
  </script>
</body>
</html>
